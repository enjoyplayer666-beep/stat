# =====================================================================
#  DsMenu - главное меню (/menu, предмет-кремень) и меню привилегий (/donate)
#  Цвета: &a, &l ... и hex &#RRGGBB. Цвета и тексты сняты со скринов сервера-образца.
#  Действия по клику (action): close - закрыть, message - написать menus.donate.click-message,
#  command:<команда> - выполнить от игрока, open:<меню> - открыть меню (main, donate), none - ничего.
#  После правки: /dsmenu reload
# =====================================================================

# Предмет меню: выдаётся в игровых мирах (вход через портал, заход, возрождение), в лобби забирается.
