name: StatPlugin
version: 1.1
main: ru.stat.StatPlugin
api-version: '1.21'
# DsRanks - ранги, убийства и бустер для /stat
softdepend: [DsRanks, MediaClans, PlaceholderAPI, DestroyChat, LuckPerms]
commands:
  stat:
    description: Статистика игрока
    usage: /stat <ник>
  mystat:
    description: Своя статистика
    usage: /mystat
  statadmin:
    description: Управление статистикой
    usage: /statadmin <set|reset|reload>
  like:
    description: Поставить лайк игроку
    usage: /like <ник>
  likegive:
    description: Лайки себе раз в сутки (ULTRA)
    usage: /likegive [ник]
permissions:
  stat.likegive:
    description: /likegive (кроме групп из likes.give-groups)
    default: false
  stat.use:
    default: true
  stat.admin:
    default: op
