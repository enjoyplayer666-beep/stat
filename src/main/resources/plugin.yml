name: StatPlugin
version: 1.1
main: ru.stat.StatPlugin
api-version: '1.21'
# DsRanks - ранги, убийства и бустер для /stat
softdepend: [DsRanks, PlaceholderAPI, DestroyChat, LuckPerms]
commands:
  stat:
    description: Статистика игрока
    usage: /stat <ник>
  mystat:
    description: Своя статистика
    usage: /mystat
  statadmin:
    description: Управление статистикой
    usage: /statadmin <set|reset|reload>
permissions:
  stat.use:
    default: true
  stat.admin:
    default: op
