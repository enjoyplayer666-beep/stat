# Плейсхолдеры в строках /stat: {player} {privilege} {rank} {clan} {rating}
# {class} {winrate} {playtime} {hours} {status} {kills} {deaths} {booster}
# {hours} - слово "час/часа/часов" под число
# Также работают плейсхолдеры PlaceholderAPI (например %luckperms_prefix%).
# Цвета: &a, &l ... и hex вида &#RRGGBB

# не трогать: по нему плагин обновляет старый config.yml
config-version: 8

lines:
  - '&#7B6FE0╭- - - - - - - - - - - - - - - - - - - - - - - -╮'
  - '&#7B6FE0│ &fНикнейм: &b{player}'
  - '&#7B6FE0│ &fПривилегия: {privilege}'
  - '&#7B6FE0│ &fРанг: {rank}'
  - '&#7B6FE0│ &fКлан: {clan}'
  - '&#7B6FE0│ &fБоевой рейтинг: &a{rating}'
  - '&#7B6FE0│ &fЗнак классности: {class}'
  - '&#7B6FE0│ &fПроцент побед на пвп: &d{winrate}'
  - '&#7B6FE0│ &fНаиграно: &#3CCFC0{playtime} {hours}'
  - '&#7B6FE0│ &fСтатус: {status}'
  - '&#7B6FE0╰- - - - - - - - - - - - - - - - - - - - - - - -╯'

# Значения по умолчанию
defaults:
  clan: '&7—'

# Привилегия в /stat по группе LuckPerms: проверяется сверху вниз (с учётом наследования),
# берётся первая группа, которая есть у игрока. Остальным - их обычный префикс из LuckPerms,
# default - если префикса нет.
# Запоминается, когда игрок в сети, поэтому у оффлайн-игроков тоже показывается.
# Вручную: /statadmin set <ник> privilege <текст> (перекрывает это), вернуть авто: privilege reset.
privileges:
  admin: '&7[&#D40000&lᴀᴅᴍɪɴ&7] [&#FFC477&lᴅs&a&l✔&7]'
  curator: '&f⌜&#E5305F&l&oᴄᴜʀᴀᴛᴏʀ&f⌟ &f⌜&#95FFD7&l&osᴘ&#33F5A8&l&o✔&f⌟'
  manager: '&f⌜&#7AF0E6&lᴍᴀɴᴀɢᴇʀ&f⌟ &f⌜&#E0606F&lᴅs&a&l✔&f⌟'
  moderator: '&7[&#D4123A&lᴍᴏᴅᴇʀᴀᴛᴏʀ&7] [&#E8D83A&lᴅs&a&l✔&7]'
  mediajr: '&f⌜&#88799C&l&oM&#8A71AF&l&oe&#8D69C2&l&od&#9061D4&l&oi&#9259E7&l&oa&#9061D4&l&o &#8D69C2&l&oJ&#8A71AF&l&or&#88799C&l&o.&f⌟'
  default: '&f⌜&3Игрок&f⌟'

status:
  online: '&aОнлайн'
  offline: '&cОффлайн'
  # добавляется к оффлайну
  # {time} - "5 минут", "3 ч.", "2 дн."
  last-seen: ' &7(заходил {time} назад)'

# ---------------------------------------------------------------------
#  Бой: боевой рейтинг (БР), процент побед, бустер
# ---------------------------------------------------------------------
combat:
  # БР за убийство игрока: случайно от min до max
  rating-min: 10
  rating-max: 30
  # Процент побед: при первом убийстве сразу 100%, выше 100% не бывает.
  # Каждые winrate-every-kills убийств: +winrate-kill-bonus %.
  # Каждые winrate-every-deaths смертей от игроков: -(winrate-death-penalty-min..max) %.
  winrate-first-kill: 100
  winrate-every-kills: 10
  winrate-kill-bonus: 1
  winrate-every-deaths: 10
  winrate-death-penalty-min: 2
  winrate-death-penalty-max: 3
  # проценты всегда целые: 90%, без 90.5%
  # повторное убийство того же игрока тем же убийцей раньше этого времени ничего не даёт (защита от фарма); 0 - выкл
  anti-farm-seconds: 300

booster:
  # шанс (в %), что бустер сработает при убийстве: тогда убийство засчитывается за xN
  chance: 30
  # бустер по праву: stat.booster.2 ... stat.booster.15 (берётся наибольший);
  # выдать вручную: /statadmin set <ник> booster <1-15>
  max: 15

# ---------------------------------------------------------------------
#  Ранги - по количеству убийств (с учётом бустера)
#  color -> color2 - градиент названия, иконка цветом color.
#  attack - +% урона по игрокам, defense - -% получаемого от игроков урона
#  (срабатывают с шансом skills.attack-chance / skills.defense-chance, если больше 0).
# ---------------------------------------------------------------------
ranks:
  - {name: 'Неофит', icon: '☘', color: '#9E9E9E', color2: '#6F6F6F', kills: 0, attack: 0, defense: 0}
  - {name: 'Призрак', icon: '☁', color: '#D0D0DA', color2: '#9A9AAA', kills: 30, attack: 0, defense: 5}
  - {name: 'Фантом', icon: '✦', color: '#62B0FF', color2: '#3A74FF', kills: 150, attack: 0, defense: 10}
  - {name: 'Вампир', icon: '♆', color: '#FF6B6B', color2: '#D23434', kills: 500, attack: 5, defense: 10}
  - {name: 'Лич', icon: '☠', color: '#E4E4E4', color2: '#A4A4B0', kills: 1000, attack: 10, defense: 15}
  - {name: 'Демон', icon: '♗', color: '#CE94E6', color2: '#9656C2', kills: 1500, attack: 15, defense: 15}
  - {name: 'Некромант', icon: '✝', color: '#72D6A6', color2: '#35977A', kills: 2000, attack: 20, defense: 20}
  - {name: 'Ведьмак', icon: '✾', color: '#E6C47E', color2: '#AE864C', kills: 3000, attack: 25, defense: 20}
  - {name: 'Барон', icon: '♚', color: '#F4AC6A', color2: '#C6763E', kills: 4000, attack: 30, defense: 25}
  - {name: 'Архидемон', icon: '♜', color: '#F58E9E', color2: '#C4566E', kills: 5000, attack: 40, defense: 25}
  - {name: 'Древний', icon: '♇', color: '#BCC4FF', color2: '#8490E2', kills: 6000, attack: 45, defense: 30}
  - {name: 'Проклятый', icon: '☫', color: '#FF9E9E', color2: '#DE5268', kills: 7000, attack: 50, defense: 30}
  - {name: 'Тёмный Владыка', icon: '♆', color: '#D688FF', color2: '#9A46E2', kills: 8000, attack: 60, defense: 35}
  - {name: 'Повелитель', icon: '♔', color: '#BC94FF', color2: '#8656E2', kills: 15000, attack: 70, defense: 40}
  - {name: 'Страж Небытия', icon: '☢', color: '#DCCCFF', color2: '#A88EE6', kills: 30000, attack: 80, defense: 45}
  - {name: 'Падший', icon: '♰', color: '#F2DAB2', color2: '#C69E6C', kills: 50000, attack: 90, defense: 45}
  - {name: 'Тень Вечности', icon: '⚜', color: '#F2DCFF', color2: '#BC9AF2', kills: 80000, attack: 100, defense: 50}

skills:
  enabled: true
  attack-chance: 33
  defense-chance: 33

# Ранг в чате DestroyChat (перед кланом). {rank} - иконка и название с градиентом
chat-rank: '{rank} '

# ---------------------------------------------------------------------
#  Знаки классности - по боевому рейтингу (БР), только для красоты:
#  0 - нет, от 1 - Мастер, 100к - EXCLUSIVE, 250к - TIGR, 500к - LEGENDARY, 1 млн - Immortal, 2 млн - Nephilim
# ---------------------------------------------------------------------
classes:
  - {rating: 0, display: '&f[Нет отличительных отметок]'}
  - {rating: 1, display: '&a«Мастер»'}
  - {rating: 100000, display: '&b«EXCLUSIVE»'}
  - {rating: 250000, display: '&0«&6虎&bTIGR&6虎&0»'}
  - {rating: 500000, display: '&c✘&3&oLEGENDARY&c✘'}
  - {rating: 1000000, display: '&4➶&e&oImmortal&4➶'}
  - {rating: 2000000, display: '&e↟&c&oNephilim&e↟'}

messages:
  usage: '&cИспользование: /stat <ник игрока>'
  not-found: '&cИгрок &f{player} &cне найден.'
  no-permission: '&cНет прав.'
  admin-usage:
    - '&e/statadmin set <ник> <privilege|rating|winrate|kills|deaths|booster> <значение>'
    - '&e/statadmin reset <ник>'
    - '&e/statadmin reload'
  set-ok: '&aУ игрока &f{player} &aполе &f{field} &aтеперь: &r{value}'
  reset-ok: '&aСтатистика игрока &f{player} &aсброшена.'
  reload-ok: '&aКонфиг и данные перезагружены.'
  bad-field: '&cНеизвестное поле. Доступно: privilege, rating, winrate, kills, deaths, booster'
  bad-number: '&cЗначение должно быть числом.'
  booster: '&6Сработал бустер &ex{booster}&6! &f+{kills} &6убийств к рангу'
  rank-up: '&aНовый ранг: {rank}&a! Смотри умения: &f/rank info'
  rank-on: '&aРанг снова показывается в чате.'
  rank-off: '&7Ранг больше не показывается в чате.'
  rank-usage:
    - '&e/rank info [ник] &7- ранг, бустер, умения'
    - '&e/rank list &7- все ранги'
    - '&e/rank top [страница] &7- топ по убийствам'
    - '&e/rank on &7/ &e/rank off &7- показывать ранг в чате'
