# ============================================
#  MediaGens - генераторы ресурсов
#  Поставить: встань на блок и /gen create <группа> <точка>, например /gen create dirt p1, потом dirt p2 на другом месте -
#  точки одной группы работают синхронно
#  У каждого игрока свой счётчик (каждый видит своё xN).
#  Встал на генератор (или в радиусе radius) - всё накопленное уходит в инвентарь.
# ============================================

generator:
  # сколько блоков добавляется и как часто (в тиках, 20 = 1 сек)
  amount: 1
  interval-ticks: 20
  # максимум; при достижении: stop - стоит на max, пока игрок не заберёт; reset - обнуляется
  max: 512
  on-full: stop
  # радиус сбора вокруг блока генератора (1 = площадка 3x3)
  radius: 1
  # надпись над генератором
  text: "<#7A7A7A>x<aqua>{count}"
  # высота блока-иконки и надписи над блоком генератора
  item-offset: 1.2
  item-scale: 0.25
  # иконка крутится и покачивается, как выпавший предмет: градусов за 1/4 секунды и высота качания
  spin-degrees: 15
  # с какого расстояния (в блоках) видно блок и надпись; дальше - не видно и не крутится (меньше нагрузка)
  view-distance: 5
  bob: 0.06
  # высота надписи над блоком генератора и её фон (#AARRGGBB, пусто - без фона)
  text-offset: 1.45
  text-background: "#40000000"

# свой размер и высота для отдельных групп (что не указано - берётся из generator)
# после изменения - /gen reload
sizes:
  # dirt:
  #   item-scale: 0.4
  #   item-offset: 1.3
  #   text-offset: 1.6

# бустеры (предметы из MediaItems): включаются ПКМ, действуют только на того, кто включил -
# его генераторы копят в multiplier раз быстрее (amount x multiplier за интервал)
boosters:
  booster_x2:      {multiplier: 2,  seconds: 120}
  booster_x2_plus: {multiplier: 2,  seconds: 240}
  booster_x3:      {multiplier: 3,  seconds: 90}
  booster_x10:     {multiplier: 10, seconds: 60}

messages:
  activated: "<green>• <white>Бустер <red>x{mult}</red> на <gold>{sec} сек.</gold> активирован!"
  already: "<red>• <white>У вас уже есть активный бустер."
  ended: "<gray>• Бустер закончился."
  actionbar: "<gold>Бустер <gray>x{mult} <dark_gray>({left} сек.)"

config-version: 5
