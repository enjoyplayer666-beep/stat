name: MediaTops
version: '1.0'
main: ru.dscraft.mediatops.MediaTopsPlugin
api-version: '1.21'
author: loserwrld
description: Голограммы-топы (бойцы, кланы, активисты) за день и за вайп, переключение кликом
softdepend: [MediaClans, StatPlugin]
commands:
  tops:
    description: Голограммы-топы
    usage: /tops <create|move|remove|list|reload>
    permission: mediatops.admin
permissions:
  mediatops.admin:
    default: op
