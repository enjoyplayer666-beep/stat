# ============================================
#  Магазины (НПС). Поставить: /itemnpc create <id магазина>
#  title - заголовок окна обмена, name - ник над НПС (MiniMessage, градиенты)
#  npc.type - моб: VILLAGER, IRON_GOLEM, SKELETON, ZOMBIE, ENDERMAN, WITHER_SKELETON, PIGLIN_BRUTE ...
#             PLAYER - игрок со скином через FancyNpcs (npc.skin: ник или ссылка на png скина);
#             пока скин не указан или нет FancyNpcs - ставится моб из fallback-type.
#  npc.equipment - что надето: head/chest/legs/feet/hand/offhand
#             "item:id" из items.yml, "MATERIAL" или "LEATHER_CHESTPLATE#RRGGBB" (крашеная кожа)
#  npc.turn: false - НПС-игрок стоит статично, не поворачивается к игроку
#  trades - обмены: buy (+ buy2) -> result.  "item:id:кол-во" или "MATERIAL:кол-во"
# ============================================
shops:

  # Мистер Пропер: конфеты -> ускорительный компонент -> бустеры генераторов
  # НПС-игрок (FancyNpcs) в скине жителя в костюме; скин лежит в репозитории, FancyNpcs загрузит его по ссылке
  proper:
    title: "<dark_green>Shopkeeper"
    name: "<gradient:#D1C564:#FDA653>Мистер Пропер"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/mister_proper.png"
      fallback-type: "VILLAGER"
    trades:
      - {buy: "item:candy:64", result: "item:accel_component"}
      - {buy: "item:accel_component:5", result: "item:booster_x2"}
      - {buy: "item:booster_x2", buy2: "item:accel_component:5", result: "item:booster_x2_plus"}
      - {buy: "item:booster_x2:2", buy2: "item:accel_component:10", result: "item:booster_x3"}
      - {buy: "item:booster_x3:5", buy2: "item:accel_component:15", result: "item:booster_x10"}

  # Талисманы (скрин): житель
  talismans:
    title: "<dark_purple><b>Талисманы"
    name: "<dark_purple><b>Талисманы"
    npc:
      type: "VILLAGER"
      profession: "none"
      villager-type: "plains"
    trades:
      - {buy: "item:poseidon_shard:6", buy2: "item:universe_charge:6", result: "item:talisman_speed"}
      - {buy: "item:lucifer_vessel:4", buy2: "item:universe_charge:6", result: "item:talisman_life"}
      - {buy: "item:lucifer_vessel:6", buy2: "item:poseidon_shard:7", result: "item:talisman_damage"}
      - {buy: "item:talisman_speed", buy2: "item:talisman_life", result: "item:talisman_super"}

  # Элитры (скрин): НПС-игрок (скин со скрина) в зачарованных элитрах, с фейерверком в руке
  elytra:
    title: "<gold><b>Элитры"
    name: "<gold><b>Элитры"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/elytra.png"
      fallback-type: "ZOMBIE"
      equipment:
        chest: "item:elytra_2"
        hand: "item:firework_3"
    trades:
      - {buy: "GOLD_INGOT:48", result: "item:compressed_gold"}
      - {buy: "item:elytra", buy2: "item:compressed_gold:32", result: "item:elytra_2"}
      - {buy: "item:compressed_gold:16", result: "item:elytra"}
      - {buy: "item:compressed_gold", result: "item:firework_1:16"}
      - {buy: "item:compressed_gold:2", result: "item:firework_2:32"}
      - {buy: "item:compressed_gold:4", result: "item:firework_3:64"}
      - {buy: "item:firework_3:64", result: "item:compressed_gold:3"}

  # Обменник 1 (скрин): НПС-игрок; сжатое золото -> другие сжатые ресурсы, элитры -> золото
  # НПС-игрок; скин - в skin (пока стандартный)
  exchanger1:
    title: "<white>Обменник <aqua>1"
    name: "<white>Обменник <aqua>1"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/exchanger1.png"
      fallback-type: "ZOMBIE"
    trades:
      - {buy: "item:compressed_gold", result: "item:compressed_coal"}
      - {buy: "item:compressed_gold:2", result: "item:compressed_iron"}
      - {buy: "item:compressed_gold:2", result: "item:compressed_diamond"}
      - {buy: "item:compressed_gold:2", result: "item:compressed_gunpowder"}
      - {buy: "item:compressed_gold:3", result: "item:compressed_cluster"}
      - {buy: "item:elytra", result: "item:compressed_gold:8"}
      - {buy: "item:elytra_2", result: "item:compressed_gold:32"}

  # Обменник 2 (скрин): НПС-игрок; сжатые ресурсы по цепочке вверх
  exchanger2:
    title: "<white>Обменник <aqua>2"
    name: "<white>Обменник <aqua>2"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/exchanger2.png"
      fallback-type: "ZOMBIE"
    trades:
      - {buy: "item:compressed_dirt:2", result: "item:compressed_stone"}
      - {buy: "item:compressed_stone:2", result: "item:compressed_coal"}
      - {buy: "item:compressed_coal:2", result: "item:compressed_iron"}
      - {buy: "item:compressed_iron:2", result: "item:compressed_diamond"}
      - {buy: "item:compressed_diamond:2", result: "item:compressed_gunpowder"}
      - {buy: "item:compressed_gunpowder:5", result: "item:compressed_cluster"}

  # Обменник 3 (скрин): НПС-игрок; сжатые ресурсы по цепочке вниз
  exchanger3:
    title: "<white>Обменник <aqua>3"
    name: "<white>Обменник <aqua>3"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/exchanger3.png"
      fallback-type: "ZOMBIE"
    trades:
      - {buy: "item:compressed_stone", result: "item:compressed_dirt"}
      - {buy: "item:compressed_coal", result: "item:compressed_stone"}
      - {buy: "item:compressed_iron", result: "item:compressed_coal"}
      - {buy: "item:compressed_diamond", result: "item:compressed_iron"}
      - {buy: "item:compressed_gunpowder", result: "item:compressed_diamond"}
      - {buy: "item:compressed_cluster", result: "item:compressed_gunpowder:2"}

  # Мастер Оттенков (скрин): НПС-игрок; 2 сжатого золота -> ресурсы
  shades:
    title: "<b><#F59230>М<#B2A144>а<#6CAF58>с<#20C267>т<#30AB84>е<#4292A3>р <#655EDF>О<#8885E0>т<#ADA8E6>т<#D9CEF0>е<#F3F3F1>н<#FDCDCA>к<#F89191>о<#FD6362>в"
    name: "<b><#F59230>М<#B2A144>а<#6CAF58>с<#20C267>т<#30AB84>е<#4292A3>р <#655EDF>О<#8885E0>т<#ADA8E6>т<#D9CEF0>е<#F3F3F1>н<#FDCDCA>к<#F89191>о<#FD6362>в"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/shades.png"
      fallback-type: "ZOMBIE"
    trades:
      - {buy: "item:compressed_gold:2", result: "COPPER_INGOT"}
      - {buy: "item:compressed_gold:2", result: "EMERALD"}
      - {buy: "item:compressed_gold:2", result: "LAPIS_LAZULI"}
      - {buy: "item:compressed_gold:2", result: "QUARTZ"}
      - {buy: "item:compressed_gold:2", result: "NETHERITE_INGOT"}
      - {buy: "item:compressed_gold:2", result: "REDSTONE"}
      - {buy: "item:compressed_gold:2", result: "item:resin_brick"}

  # Титулы (скрин): НПС-игрок, по клику - меню титулов (не торговля)
  titles:
    title: "<dark_purple><u>Титулы"
    name: "<dark_purple><u>Титулы"
    npc:
      type: "PLAYER"
      menu: "titles"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/titles.png"
      fallback-type: "ZOMBIE"
    trades: []

  # Компрессор (скрин): житель, ресурсы -> сжатые блоки
  compressor:
    title: "<white><b>Компрессор"
    name: "<white><b>Компрессор"
    npc:
      type: "VILLAGER"
      profession: "none"
      villager-type: "plains"
    trades:
      - {buy: "DIRT:64", result: "item:compressed_dirt"}
      - {buy: "STONE:32", result: "item:compressed_stone"}
      - {buy: "COAL:48", result: "item:compressed_coal"}
      - {buy: "IRON_INGOT:32", result: "item:compressed_iron"}
      - {buy: "DIAMOND:64", result: "item:compressed_diamond"}
      - {buy: "GUNPOWDER:64", result: "item:compressed_gunpowder"}
      - {buy: "GOLD_INGOT:48", result: "item:compressed_gold"}

  # Декомпрессор (скрин): житель, сжатые блоки -> обратно в ресурсы
  decompressor:
    title: "<white><b>Декомпрессор"
    name: "<white><b>Декомпрессор"
    npc:
      type: "VILLAGER"
      profession: "none"
      villager-type: "plains"
    trades:
      - {buy: "item:compressed_dirt", result: "DIRT:64"}
      - {buy: "item:compressed_stone", result: "STONE:32"}
      - {buy: "item:compressed_coal", result: "COAL:48"}
      - {buy: "item:compressed_iron", result: "IRON_INGOT:32"}
      - {buy: "item:compressed_diamond", result: "DIAMOND:64"}
      - {buy: "item:compressed_gunpowder", result: "GUNPOWDER:64"}
      - {buy: "item:compressed_gold", result: "GOLD_INGOT:48"}

  # Кожаная броня (скрин): 12 земли -> кожа [I]; кожа [I] + сжатая земля -> кожа [II]
  # НПС-игрок (скин со скрина) в кожаной броне
  leather:
    title: "<white><b>Кожанная броня"
    name: "<white><b>Кожанная броня"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/leather.png"
      fallback-type: "ZOMBIE"
      equipment:
        head: "LEATHER_HELMET"
        chest: "LEATHER_CHESTPLATE"
        legs: "LEATHER_LEGGINGS"
        feet: "LEATHER_BOOTS"
    trades:
      - {buy: "DIRT:12", result: "item:leather_helmet"}
      - {buy: "DIRT:12", result: "item:leather_chestplate"}
      - {buy: "DIRT:12", result: "item:leather_leggings"}
      - {buy: "DIRT:12", result: "item:leather_boots"}
      - {buy: "item:separator", buy2: "item:separator", result: "item:separator"}
      - {buy: "item:leather_helmet", buy2: "item:compressed_dirt", result: "item:leather_helmet_2"}
      - {buy: "item:leather_chestplate", buy2: "item:compressed_dirt", result: "item:leather_chestplate_2"}
      - {buy: "item:leather_leggings", buy2: "item:compressed_dirt", result: "item:leather_leggings_2"}
      - {buy: "item:leather_boots", buy2: "item:compressed_dirt", result: "item:leather_boots_2"}

  # Деревянные мечи (скрин): 32 земли -> меч [I]; 2 сжатой земли + меч [I] -> меч [II]
  # НПС-игрок (девушка в синей куртке, скин со скрина)
  wood:
    title: "<white><b>Деревянные мечи"
    name: "<white><b>Деревянные мечи"
    npc:
      type: "PLAYER"
      skin: "https://raw.githubusercontent.com/enjoyplayer666-beep/stat/claude/sharp-brahmagupta-ptif54/items/skins/wood.png"
      fallback-type: "ZOMBIE"
      equipment:
        hand: "item:wooden_sword"
    trades:
      - {buy: "DIRT:32", result: "item:wooden_sword"}
      - {buy: "item:compressed_dirt:2", buy2: "item:wooden_sword", result: "item:wooden_sword_2"}

  # Кольчуга (скрин): кожаная вещь [II] + 32 угля -> кольчуга [I]; кольчуга [I] + сжатый уголь -> [II]
  chain:
    title: "<gray>Кольчужный сет"
    name: "<gray>Кольчужный сет"
    npc:
      type: "SKELETON"
      equipment:
        head: "CHAINMAIL_HELMET"
        chest: "CHAINMAIL_CHESTPLATE"
        legs: "CHAINMAIL_LEGGINGS"
        feet: "CHAINMAIL_BOOTS"
        hand: "NETHERITE_AXE"
    trades:
      - {buy: "item:leather_helmet_2", buy2: "COAL:32", result: "item:chain_helmet"}
      - {buy: "item:leather_chestplate_2", buy2: "COAL:32", result: "item:chain_chestplate"}
      - {buy: "item:leather_leggings_2", buy2: "COAL:32", result: "item:chain_leggings"}
      - {buy: "item:leather_boots_2", buy2: "COAL:32", result: "item:chain_boots"}
      - {buy: "item:wooden_sword_2", buy2: "COAL:32", result: "item:chain_sword"}
      - {buy: "item:separator", buy2: "item:separator", result: "item:separator"}
      - {buy: "item:chain_helmet", buy2: "item:compressed_coal:1", result: "item:chain_helmet_2"}
      - {buy: "item:chain_chestplate", buy2: "item:compressed_coal:2", result: "item:chain_chestplate_2"}
      - {buy: "item:chain_leggings", buy2: "item:compressed_coal:2", result: "item:chain_leggings_2"}
      - {buy: "item:chain_boots", buy2: "item:compressed_coal:1", result: "item:chain_boots_2"}

  # Железо (по той же схеме, пока без скрина): кольчуга [II] + 16 железа -> [I]; [I] + сжатое железо -> [II]
  iron:
    title: "<white><b>Железный сет"
    name: "<white><b>Железный сет"
    npc:
      type: "IRON_GOLEM"
    trades:
      - {buy: "item:chain_helmet_2", buy2: "IRON_INGOT:16", result: "item:iron_helmet"}
      - {buy: "item:chain_chestplate_2", buy2: "IRON_INGOT:16", result: "item:iron_chestplate"}
      - {buy: "item:chain_leggings_2", buy2: "IRON_INGOT:16", result: "item:iron_leggings"}
      - {buy: "item:chain_boots_2", buy2: "IRON_INGOT:16", result: "item:iron_boots"}
      - {buy: "item:chain_sword", buy2: "IRON_INGOT:16", result: "item:iron_sword"}
      - {buy: "item:separator", buy2: "item:separator", result: "item:separator"}
      - {buy: "item:iron_helmet", buy2: "item:compressed_iron:1", result: "item:iron_helmet_2"}
      - {buy: "item:iron_chestplate", buy2: "item:compressed_iron:2", result: "item:iron_chestplate_2"}
      - {buy: "item:iron_leggings", buy2: "item:compressed_iron:2", result: "item:iron_leggings_2"}
      - {buy: "item:iron_boots", buy2: "item:compressed_iron:1", result: "item:iron_boots_2"}
      - {buy: "item:iron_sword", buy2: "item:compressed_iron:2", result: "item:iron_sword_2"}

  # Алмаз (скрин): железо [II] + 16 алмазов -> [I]; [I] + сжатый алмаз -> [II]
  diamond:
    title: "<aqua><b>Алмазный сет"
    name: "<aqua><b>Алмазный сет"
    npc:
      type: "SKELETON"
      equipment:
        head: "DIAMOND_HELMET"
        chest: "DIAMOND_CHESTPLATE"
        legs: "DIAMOND_LEGGINGS"
        feet: "DIAMOND_BOOTS"
        hand: "DIAMOND_SWORD"
    trades:
      - {buy: "item:iron_helmet_2", buy2: "DIAMOND:16", result: "item:diamond_helmet"}
      - {buy: "item:iron_chestplate_2", buy2: "DIAMOND:16", result: "item:diamond_chestplate"}
      - {buy: "item:iron_leggings_2", buy2: "DIAMOND:16", result: "item:diamond_leggings"}
      - {buy: "item:iron_boots_2", buy2: "DIAMOND:16", result: "item:diamond_boots"}
      - {buy: "item:iron_sword_2", buy2: "DIAMOND:16", result: "item:diamond_sword"}
      - {buy: "item:separator", buy2: "item:separator", result: "item:separator"}
      - {buy: "item:diamond_helmet", buy2: "item:compressed_diamond:1", result: "item:diamond_helmet_2"}
      - {buy: "item:diamond_chestplate", buy2: "item:compressed_diamond:2", result: "item:diamond_chestplate_2"}
      - {buy: "item:diamond_leggings", buy2: "item:compressed_diamond:2", result: "item:diamond_leggings_2"}
      - {buy: "item:diamond_boots", buy2: "item:compressed_diamond:1", result: "item:diamond_boots_2"}
      - {buy: "item:diamond_sword", buy2: "item:compressed_diamond:2", result: "item:diamond_sword_2"}

  # Незерит (скрин, блейз): алмаз [II] + 16 пороха (меч 32) -> [I]; [I] + сжатый порох (каска/ботинки 1, куртка/штаны 2, меч 3) -> [II]
  netherite:
    title: "<dark_gray><b>Незеритовый сет"
    name: "<dark_gray><b>Незеритовый сет"
    npc:
      type: "BLAZE"
    trades:
      - {buy: "item:diamond_helmet_2", buy2: "GUNPOWDER:16", result: "item:netherite_helmet"}
      - {buy: "item:diamond_chestplate_2", buy2: "GUNPOWDER:16", result: "item:netherite_chestplate"}
      - {buy: "item:diamond_leggings_2", buy2: "GUNPOWDER:16", result: "item:netherite_leggings"}
      - {buy: "item:diamond_boots_2", buy2: "GUNPOWDER:16", result: "item:netherite_boots"}
      - {buy: "item:diamond_sword_2", buy2: "GUNPOWDER:32", result: "item:netherite_sword"}
      - {buy: "item:separator", buy2: "item:separator", result: "item:separator"}
      - {buy: "item:netherite_helmet", buy2: "item:compressed_gunpowder:1", result: "item:netherite_helmet_2"}
      - {buy: "item:netherite_chestplate", buy2: "item:compressed_gunpowder:2", result: "item:netherite_chestplate_2"}
      - {buy: "item:netherite_leggings", buy2: "item:compressed_gunpowder:2", result: "item:netherite_leggings_2"}
      - {buy: "item:netherite_boots", buy2: "item:compressed_gunpowder:1", result: "item:netherite_boots_2"}
      - {buy: "item:netherite_sword", buy2: "item:compressed_gunpowder:3", result: "item:netherite_sword_2"}

  # Аметист (скрин): 20 осколков -> кластер, 2 кластера -> сжатый кластер, незерит [II] + сжатый кластер (меч - 2) -> аметист
  amethyst:
    title: "<light_purple><b>Аметистовый сет"
    name: "<light_purple><b>Аметистовый сет"
    npc:
      type: "ENDERMAN"
    trades:
      - {buy: "AMETHYST_SHARD:20", result: "item:amethyst_cluster"}
      - {buy: "item:amethyst_cluster:2", result: "item:compressed_cluster"}
      - {buy: "item:netherite_sword_2", buy2: "item:compressed_cluster:2", result: "item:amethyst_sword"}
      - {buy: "item:netherite_helmet_2", buy2: "item:compressed_cluster", result: "item:amethyst_helmet"}
      - {buy: "item:netherite_chestplate_2", buy2: "item:compressed_cluster", result: "item:amethyst_chestplate"}
      - {buy: "item:netherite_leggings_2", buy2: "item:compressed_cluster", result: "item:amethyst_leggings"}
      - {buy: "item:netherite_boots_2", buy2: "item:compressed_cluster", result: "item:amethyst_boots"}

  # Обсидиан (скрин): у НПС только блоки и призма; вещи - в наковальне (/anvil, /upgrade), у НПС они видны подсказкой
  obsidian:
    title: "<black><b>Обсидиановый сет"
    name: "<black><b>Обсидиановый сет"
    npc:
      type: "SKELETON"
      equipment:
        chest: "LEATHER_CHESTPLATE#4A2378"
        legs: "LEATHER_LEGGINGS#4A2378"
        feet: "LEATHER_BOOTS#2E1650"
        hand: "item:obsidian_sword"
    trades:
      - {buy: "CRYING_OBSIDIAN:32", result: "item:compressed_obsidian"}
      - {buy: "item:compressed_obsidian:6", result: "item:obsidian_cluster"}
      - {buy: "item:separator", buy2: "item:separator", result: "item:separator"}
      - {buy: "item:prism_1", buy2: "item:obsidian_cluster:2", result: "item:prism_2"}
    anvil:
      - {item: "item:amethyst_sword", with: "item:obsidian_cluster:12", result: "item:obsidian_sword"}
      - {item: "item:elytra_2", with: "item:obsidian_cluster:12", result: "item:obsidian_elytra"}
      - {item: "item:amethyst_helmet", with: "item:obsidian_cluster:4", result: "item:obsidian_helmet"}
      - {item: "item:amethyst_chestplate", with: "item:obsidian_cluster:4", result: "item:obsidian_chestplate"}
      - {item: "item:amethyst_leggings", with: "item:obsidian_cluster:4", result: "item:obsidian_leggings"}
      - {item: "item:amethyst_boots", with: "item:obsidian_cluster:4", result: "item:obsidian_boots"}

  # Majestic (скрин): у НПС пурпур -> сжатый пурпур -> пурпурный кластер; вещи - в наковальне из обсидиановых
  majestic:
