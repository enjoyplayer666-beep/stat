# ============================================
#  MediaItems - НПС-торговцы сетами и мечами
#  Предметы: items.yml, магазины и внешний вид НПС: shops.yml
#  Поставить НПС: /itemnpc create <магазин>   (магазины: /itemnpc shops)
#  После правок: /itemnpc reload
# ============================================

# Оформление описания предметов. Цвета сняты попиксельно со скринов.
tooltip:
  bracket-color: "#AAAAAA"          # [ ] вокруг иконки
  level-gradient: ["#D0D0D0", "#888888"]  # уровень из 2+ букв (II, XII, XXX)
  single-level-color: "#FFFFFF"     # уровень из 1 буквы (V, X)
  plus-color: "#FFFF55"             # "+" перед числом атрибута
  number-color: "#FFFFFF"           # само число
  header-color: "#AAAAAA"           # "Когда обуто:" и т.п.
  # название атрибута: белый, каждая следующая буква темнее на step
  attribute-fade: {start: 255, step: 10, min: 64}

  slots:
    head: "Когда надето на голову:"
    chest: "Когда надето:"
    legs: "Когда надето на ноги:"
    feet: "Когда обуто:"
    hand: "Когда в ведущей руке:"
    offhand: "Когда во второстепенной руке:"
    any: "Когда в инвентаре:"

  # зачарования: иконка (символ шрифта Minecraft), её цвет, название и его градиент
  # gradient-letters: на сколько первых букв растянут градиент (дальше - цвет конца)
  enchants:
    protection:        {icon: "🛡", icon-color: "#5555FF", name: "Защита", gradient: ["#4498DB", "#777777"]}
    fire_protection:   {icon: "🔥", icon-color: "#FF5555", name: "Огнеупорность", gradient: ["#E7AA59", "#EE2D2D"]}
    blast_protection:  {icon: "🛡", icon-color: "#FFAA00", name: "Взрывоустойчивость", gradient: ["#E7AA59", "#AA5500"]}
    projectile_protection: {icon: "🛡", icon-color: "#AAAAAA", name: "Защита от снарядов", gradient: ["#D0D0D0", "#777777"]}
    thorns:            {icon: "⚔", icon-color: "#6C49B0", name: "Шипы", gradient: ["#6C49B0", "#433B7A"]}
    feather_falling:   {icon: "🪶", icon-color: "#FFFFFF", name: "Невесомость", gradient: ["#FFFFFF", "#AAAAAA"]}
    unbreaking:        {icon: "⛨", icon-color: "#AAAAAA", name: "Прочность", gradient: ["#D0D0D0", "#777777"]}
    sharpness:         {icon: "🗡", icon-color: "#445C6B", name: "Острота", gradient: ["#6B3F68", "#BF7718"]}
    fire_aspect:       {icon: "🔥", icon-color: "#E89552", name: "Заговор огня", gradient: ["#E7AA59", "#EE2D2D"], gradient-letters: 7}
    sweeping_edge:     {icon: "⚔", icon-color: "#384B7E", name: "Разящий клинок", gradient: ["#284C63", "#7E43F5"]}
    knockback:         {icon: "⚔", icon-color: "#AAAAAA", name: "Отдача", gradient: ["#D0D0D0", "#777777"]}
    looting:           {icon: "⚔", icon-color: "#FFAA00", name: "Добыча", gradient: ["#FFD27F", "#FFAA00"]}

  # атрибуты: иконка, её цвет и название
  attributes:
    armor:                {icon: "🛡", color: "#55FFFF", name: "Броня"}
    armor_toughness:      {icon: "💎", color: "#00AAAA", name: "Твёрдость брони"}
    knockback_resistance: {icon: "🛡", color: "#00AA00", name: "Сопротивление к отбрасыванию"}
    max_health:           {icon: "❤", color: "#AA0000", name: "Максимальное здоровье"}
    attack_damage:        {icon: "⚔", color: "#FF5555", name: "Урон при атаке"}
    attack_speed:         {icon: "⚡", color: "#FFFF55", name: "Скорость атаки"}
    movement_speed:       {icon: "🏃", color: "#FFFF55", name: "Скорость"}

# элитры (обычные и элитры сетов) не тратят прочность
elytra-no-durability: true

# команды, которые открывают наковальню для улучшения сетов (перехватываются раньше Essentials)
anvil-commands: ["/anvil", "/upgrade"]

# Здоровье: в хотбаре всегда hotbar-hp (20 = 10 сердечек), сколько бы HP ни давали сеты;
# строка под ником у игроков (как в скорборде): "440 ❤". Игра сама поднимает ник, голова/шлем её не перекрывают
# {hp} - здоровье числом, {hearts} - сердечки в хотбаре
health:
  enabled: true
  # здоровье без брони (ванильное - 20); сеты добавляют своё сверху
  base-hp: 10
  hotbar-hp: 20
  format: "<white>{hp} <dark_red>❤"
  # миры, где надпись не показывается (world - лобби)
  disabled-worlds: ["world"]

