# ============================================
#  Предметы MediaItems
#  material  - предмет Minecraft, model - custom_model_data из ресурспака SP-DS
#  color     - цвет кожаной брони (иконка из пака тоже красится этим цветом)
#  name      - MiniMessage (<gradient:#A:#B>, <b>, <#RRGGBB>)
#  enchants  - "ключ:уровень" (+ ":#RRGGBB" - свой цвет уровня). Реально накладываются на предмет,
#              ванильная строка скрыта, вместо неё своя: [иконка] Название УРОВЕНЬ
#  attributes- "ключ:число" (armor, armor_toughness, knockback_resistance, max_health,
#              attack_damage, attack_speed). Реально работают, показываются своими строками.
#  lore-mode: vanilla - атрибуты показывает сама игра (как у кольчуги/железа/алмаза на скринах)
#  lore      - дополнительные строки в конце описания
#  Выдать себе для проверки: /itemnpc give <id>
# ============================================
