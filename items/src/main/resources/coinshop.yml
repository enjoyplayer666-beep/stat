# ============================================
#  Магазины за коины (MediaCoins): НПС "Предметы" и "Сеты"
#  Поставить НПС: /itemnpc create coin_items   и   /itemnpc create coin_sets
#  Предметы - id из items.yml. После правки: /itemnpc reload
# ============================================

# строка цены под описанием вещи и в наборах ({price})
price-line: "<white>Цена: <yellow>{price}</yellow> коинов"
# рамка окон
border: "PURPLE_STAINED_GLASS_PANE"
# первый клик по товару - вместо него эта кнопка, второй клик - оплата
confirm:
  icon: "LIME_STAINED_GLASS_PANE"
  name: "<green>Подтвердить покупку"
  lore: ["<white>Нажмите еще раз для оплаты"]
# кнопка "Назад" в категориях
back:
  slot: 49
  icon: "GRAY_SHULKER_BOX"
  name: "<#FF5555>Назад"

messages:
  no-coins: "<red>• <white>Недостаточно коинов: нужно <yellow>{price}</yellow>, у тебя <yellow>{coins}</yellow>."
  bought: "<green>• <white>Покупка совершена за <yellow>{price}</yellow> коинов!"

