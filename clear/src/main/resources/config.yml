# =====================================================================
#  MediaClear - очистка предметов с земли
#  Работает во всех мирах, кроме excluded-worlds (лобби). Сообщения видят только игроки
#  в этих мирах. Сколько предметов удалено - не пишется.
#  Цвета: &-коды и &#RRGGBB.
# =====================================================================

# как часто чистить (в секундах): 300 = 5 минут
interval-seconds: 300

# обнулять накопленное в генераторах (MediaGens) вместе с очисткой - кто успел, тот забрал
clear-generators: true

# миры, где очистки нет (как в /mv list)
excluded-worlds: ["world"]

# предупреждения: за сколько секунд до очистки -> текст ({time} - число секунд)
warnings:
  30: "&#33EC48◆ &fУдаляем предметы с земли через &#33EC48{time} &fсекунд."
  5: "&#31F046◆ &fУдаляем предметы с земли через &#31F046{time}.."
  4: "&#C1E90D◆ &fУдаляем предметы с земли через &#C1E90D{time}.."
  3: "&#EBA510◆ &fУдаляем предметы с земли через &#EBA510{time}.."
  2: "&#EB6912◆ &fУдаляем предметы с земли через &#EB6912{time}.."
  1: "&#E51510◆ &fУдаляем предметы с земли через &#E51510{time}.."

done: "&#FF130D◆ &fОчистка завершена!"
