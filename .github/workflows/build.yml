name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - run: mvn -B -f ranks/pom.xml package
      - run: mvn -B -f tops/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: StatPlugin
          path: target/StatPlugin.jar
      - uses: actions/upload-artifact@v4
        with:
          name: DsRanks
          path: ranks/target/DsRanks.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MediaTops
          path: tops/target/MediaTops.jar
