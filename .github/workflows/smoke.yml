# Проверка на живом сервере (при пуше с [smoke] в сообщении коммита): Paper 1.21.1 + все плагины из веток jars,
# сервер стартует, выполняет несколько команд и выключается; в логе ищем ошибки.
name: smoke
on:
  workflow_dispatch:
  push:
    branches: [claude/sharp-brahmagupta-ptif54]
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: plugins
        run: |
          mkdir -p srv/plugins && cd srv/plugins
          for r in stat DestroyChat DsLobbyV2 mediadestroyauthv2; do
            git clone -q --depth 1 -b jars "https://x-access-token:${{ github.token }}@github.com/enjoyplayer666-beep/$r.git" "/tmp/$r" || git clone -q --depth 1 -b jars "https://github.com/enjoyplayer666-beep/$r.git" "/tmp/$r" || echo "no access to $r"
            cp /tmp/$r/*.jar . 2>/dev/null || true
          done
          U=$(curl -sf -A "dscraft-smoke" 'https://api.modrinth.com/v2/project/luckperms/version?loaders=%5B%22bukkit%22%5D&game_versions=%5B%221.21.1%22%5D' | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['files'][0]['url'])") && curl -sfL -o LuckPerms.jar "$U" || echo "no LuckPerms"
          ls -la
      - name: paper
        run: |
          cd srv
          U=$(curl -sf -A "dscraft-smoke" https://fill.papermc.io/v3/projects/paper/versions/1.21.1/builds | python3 -c "
          import json,sys
          b=json.load(sys.stdin)
          b=b if isinstance(b,list) else b.get('builds',b)
          b=sorted(b,key=lambda x:x['id'])[-1]
          print(b['downloads']['server:default']['url'])")
          echo "$U"
          curl -sfL -A "dscraft-smoke" -o paper.jar "$U"
          ls -la paper.jar
          echo "eula=true" > eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n" > server.properties
      - name: run
        run: |
          cd srv
          # старые папки, как на живом сервере: должны переехать в новые
          mkdir -p plugins/MediaCoins plugins/DestroyChat plugins/DestroyLobby plugins/MediaBans
          echo "11111111-2222-3333-4444-555555555555: 777" > plugins/MediaCoins/coins.yml
          echo "old-chat" > plugins/DestroyChat/marker.txt
          echo "old-lobby" > plugins/DestroyLobby/marker.txt
          echo "old-bans" > plugins/MediaBans/marker.txt
          mkfifo in
          (java -Xmx2G -jar paper.jar --nogui < in > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3> in
          for i in $(seq 1 240); do grep -q "Done (" server.log && break; sleep 1; done
          sleep 5
          for c in plugins "mediapvp" "tops" "coins" "gen" "destroychat reload" "destroylobby reload" "mediabans" "mediatab" "destroymotd reload" "statadmin" "itemnpc" "mediaclear" "barrier list" "barrier reload"; do echo "$c" >&3; sleep 2; done
          sleep 15
          echo stop >&3
          for i in $(seq 1 60); do grep -q "^exit" server.log && break; sleep 1; done
          exec 3>&-
      - name: log
        if: always()
        run: |
          cd srv
          echo "===== ERRORS ====="
          grep -n -i -E "exception|error|severe|не запустился|caused by|could not" server.log | grep -v -i "errorlevel" | head -150 || true
          echo "===== FULL LOG ====="
          cat server.log
          echo "===== MIGRATION ====="
          cat plugins/MediaEconomy/MediaCoins/coins.yml plugins/MediaDestroyChat/marker.txt plugins/MediaDestroyLobby/marker.txt plugins/MediaDestroyChat/MediaBans/marker.txt || echo "MIGRATION FAILED"
          echo "===== FOLDERS ====="
          find plugins -maxdepth 2 | sort
